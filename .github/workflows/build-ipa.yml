name: Build unsigned IPA

on:
  push:
    branches: [main]
    paths: [project.yml]
  workflow_dispatch:
    inputs:
      mode:
        description: "Native includes both emulator cores; interface contains no emulator binaries."
        required: true
        default: native
        type: choice
        options: [native, interface]

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}-${{ inputs.mode || 'native' }}
  cancel-in-progress: false

jobs:
  archive:
    name: ${{ inputs.mode || 'native' }} · unsigned arm64 IPA
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reserve version tag at the build source
        if: inputs.mode != 'interface' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTAG'
          import json, os, re, subprocess
          from pathlib import Path
          version = re.search(r'MARKETING_VERSION: "([0-9]+[.][0-9]+[.][0-9]+)"', Path('project.yml').read_text())
          if not version:
              raise SystemExit('Expected a three-component marketing version.')
          repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
          tag = 'v' + version.group(1)
          result = subprocess.run(['gh', 'api', f'repos/{repo}/git/ref/tags/{tag}'], capture_output=True, text=True)
          if result.returncode == 0:
              target = subprocess.check_output(['gh', 'api', f'repos/{repo}/commits/{tag}', '--jq', '.sha'], text=True).strip()
              if target != sha:
                  raise SystemExit('This version is already tagged at another commit. Bump the version/build before publishing.')
          elif 'HTTP 404' in result.stderr:
              subprocess.run(['gh', 'api', '--method', 'POST', f'repos/{repo}/git/refs', '-f', f'ref=refs/tags/{tag}', '-f', f'sha={sha}'], check=True, stdout=subprocess.DEVNULL)
          else:
              raise SystemExit(result.stderr)
          PYTAG

      - name: Select Xcode 26 or later
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          candidates = []
          for app in Path('/Applications').glob('Xcode*.app'):
              developer = app / 'Contents/Developer'
              try:
                  output = subprocess.check_output([str(developer / 'usr/bin/xcodebuild'), '-version'], text=True)
                  match = re.search(r'Xcode (\d+)(?:\.(\d+))?', output)
                  if match and int(match.group(1)) >= 26:
                      candidates.append(((int(match.group(1)), int(match.group(2) or 0)), developer))
              except (OSError, subprocess.CalledProcessError):
                  continue
          if not candidates:
              raise SystemExit('This project requires Xcode 26+ / Swift 6.2. Select a macOS runner with that Xcode installed.')
          selected = max(candidates, key=lambda item: item[0])[1]
          subprocess.run(['sudo', 'xcode-select', '--switch', str(selected)], check=True)
          subprocess.run(['xcodebuild', '-version'], check=True)
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET for native Switch core
        if: inputs.mode != 'interface'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install xcodegen git-lfs
          git lfs install --local

      - name: Test local library
        run: swift test --package-path Packages/EmulationKit

      - name: Fingerprint native build toolchain
        if: inputs.mode != 'interface'
        id: switch-toolchain
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import re
          import subprocess

          def output(*args):
              return subprocess.check_output(args, text=True).strip()

          versions = re.findall(r"^(8\.\d+\.\d+)[ \[]", output("dotnet", "--list-sdks"), re.MULTILINE)
          sdk = max(versions, key=lambda value: tuple(map(int, value.split("."))))
          toolchain = {
              "xcode": output("xcodebuild", "-version"),
              "iphoneos_sdk": output("xcrun", "--sdk", "iphoneos", "--show-sdk-version"),
              "host_architecture": platform.machine(),
              "dotnet_sdk": sdk,
          }
          fingerprint = hashlib.sha256(json.dumps(toolchain, sort_keys=True).encode()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output_file:
              output_file.write("fingerprint=" + fingerprint + "\n")
          PY

      - name: Restore compiled Switch runtime
        if: inputs.mode != 'interface'
        id: switch-cache
        uses: actions/cache/restore@v4
        with:
          key: switch-ios-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.switch-toolchain.outputs.fingerprint }}-${{ hashFiles('scripts/build_switch.sh', 'scripts/patch_switch.py', 'scripts/package_ipa.py') }}
          path: |
            Frameworks/SwitchBuildManifest.json
            Frameworks/Ryujinx.Headless.SDL2.dylib
            Frameworks/libMoltenVK.dylib
            Frameworks/libavcodec.dylib
            Frameworks/libavutil.dylib
            Frameworks/SDL2.xcframework
            Frameworks/BreakpointJIT.framework
            Frameworks/Hypervisor.framework
            Frameworks/Notices/Switch

      - name: Build and package compiled iOS app
        shell: bash
        env:
          TANDEM_IPA_MODE: ${{ inputs.mode || 'native' }}
          TANDEM_SWITCH_CACHE: "1"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tandem-ipa"
          bash scripts/build_ipa.sh "--$TANDEM_IPA_MODE" --output "$RUNNER_TEMP/tandem-ipa" \
            2>&1 | tee "$RUNNER_TEMP/tandem-ipa/prepare-and-build.log"

      - name: Save completed Switch runtime for later builds
        if: always() && inputs.mode != 'interface' && steps.switch-toolchain.outcome == 'success' && steps.switch-cache.outputs.cache-hit != 'true' && hashFiles('Frameworks/SwitchBuildManifest.json') != ''
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.switch-cache.outputs.cache-primary-key }}
          path: |
            Frameworks/SwitchBuildManifest.json
            Frameworks/Ryujinx.Headless.SDL2.dylib
            Frameworks/libMoltenVK.dylib
            Frameworks/libavcodec.dylib
            Frameworks/libavutil.dylib
            Frameworks/SDL2.xcframework
            Frameworks/BreakpointJIT.framework
            Frameworks/Hypervisor.framework
            Frameworks/Notices/Switch

      - name: Upload successful IPA and manifest
        uses: actions/upload-artifact@v4
        with:
          name: Tandem-${{ inputs.mode || 'native' }}-unsigned-IPA
          path: |
            ${{ runner.temp }}/tandem-ipa/*.ipa
            ${{ runner.temp }}/tandem-ipa/*.json
            ${{ runner.temp }}/tandem-ipa/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tandem-${{ inputs.mode || 'native' }}-build-logs
          path: |
            ${{ runner.temp }}/tandem-ipa/**/*.log
            ${{ runner.temp }}/tandem-ipa/**/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
